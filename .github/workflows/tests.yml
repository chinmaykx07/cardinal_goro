name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Unit tests and regression gate (fails on any false accept or false reject)
        run: python -m pytest -q tests
      - name: Frozen experiment files match recorded hashes
        run: |
          cd experiment
          sed 's|  |  frozen_as_run/|' code_hashes.txt | sha256sum -c

  reproduce:
    # Rebuilds every DEV result from the pinned public data and checks it is byte-identical.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Reproduce DEV results and regression set from orgpedia/mahgrs (DEV2 only)
        run: scripts/reproduce_dev.sh "$RUNNER_TEMP/mahgrs"
