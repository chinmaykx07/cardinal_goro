name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Frozen experiment files match recorded hashes
        run: cd experiment && sed 's#  #  frozen_as_run/#' code_hashes.txt | sha256sum -c
